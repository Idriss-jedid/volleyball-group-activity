name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pandas matplotlib pillow pyyaml optuna pytest ruff
          pip install -e .
      - name: Lint
        run: ruff check src tests kaggle scripts && ruff format --check src tests kaggle scripts
      - name: Test
        run: pytest -q   # data-dependent tests skip without data/processed/annotations.pkl
