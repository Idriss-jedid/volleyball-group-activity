# Ablation of B8: average instead of max pooling (paper: 80.7 vs 81.9).
defaults: base.yaml
model: hier
features: person_ft

model_args:
  person_lstm:
    checkpoint: person_lstm/best.pt   # relative to paths.results
    hidden: 512
  scene_lstm: true
  groups: 2             # 1 = pool all players, 2 = left team / right team
  pool: avg
  fc_dim: 1024
  scene_hidden: 512
  dropout: 0.5

train:
  batch_size: 64
  num_workers: 0
  epochs: 60
  lr: 1.0e-3
  early_stopping_patience: 10
