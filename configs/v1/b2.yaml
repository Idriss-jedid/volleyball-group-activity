# Paper B2 — Person Classification: ImageNet AlexNet fc7 (not fine-tuned), pooled over all people,
# softmax. Paper: 64.6%.
defaults: features.yaml
model: b3
features: v1_imagenet
model_args: {groups: 1, pool: max, hidden: 0, dropout: 0.5}
train:
  lr: 1.0e-3   # 1e-2 diverges on raw ImageNet fc7 (train loss ~100 in the first epoch)
