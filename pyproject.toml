[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gar"
version = "0.1.0"
description = "Group Activity Recognition on the Volleyball dataset (Ibrahim et al. reimplementation)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E731", "B905", "SIM108", "UP006", "UP035", "C408"]  # small lambdas, zip(strict) is 3.10+, dict(k=v) kwargs

[tool.ruff.lint.isort]
known-first-party = ["gar"]
